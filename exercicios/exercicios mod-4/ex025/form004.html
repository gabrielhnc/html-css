<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste Formulário</h1>

    <form action="" autocomplete="on" method="GET">
        <fieldset>
            <legend>Dados Pessoais</legend>

            <p>
                <label for="name">Nome</label>
                <input type="text" name="name" id="name" placeholder="Digite seu nome..." required>
            </p>
            
            <p>
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" placeholder="Digite seu e-mail..." autocomplete="email" required>
            </p>

            <p>
                <label for="telefone">Telefone</label>
                <input type="tel" name="telefone" id="telefone" autocomplete="tel" pattern="^\(\d{2}\) \d{4,5}-\d{4,5}" placeholder="Ex: (xx) xxxxx-xxxx" required>
            </p>

            <!-- RegEx (Expressões Regulares - importante para validação diretamente nos campos de formulário) -->
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
