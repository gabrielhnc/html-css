<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste Formulário</h1>

    <form action="cadastro.php" autocomplete="on" method="GET">
        <p>
            <label for="num">Numero</label>
            <input type="range" name="num" id="num" min="0" max="10" value="0" required oninput="valor.innerHTML = Number(num.value)"> 
            <output id="valor">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
