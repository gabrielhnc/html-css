<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste Formulário</h1>

    <form autocomplete="on" method="GET">
        <p>
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" placeholder="Nome Completo..." maxlength="30" autocomplete="name" required>
        </p>

        <p>
            <label for="media">Média</label>
            <input type="number" name="media" id="media" min="0" max="10" placeholder="0 a 10" step="0.01" required>
        </p>

        <p>
            <label for="mes">Período Letivo</label>
            <input type="month" name="mes" value="2026-09" required>
        </p>

        <p>
            <label for="data">Período Letivo</label>
            <input type="date" name="data" value="2026-09-04" required>
        </p>

        <p>
            <label for="hora">Período Letivo</label>
            <input type="time" name="hora" value="10:00" required>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
