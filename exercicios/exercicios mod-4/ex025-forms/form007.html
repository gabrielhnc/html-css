<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste Formulário</h1>

    <form action="cadastro.php" autocomplete="on" method="POST">
        <p>
            <label for="estado">Estado</label>
            <select name="estado" id="estado">

                <option value="" selected>Escolha uma Opção</option>
                <optgroup label="Sudeste">
                    <option value="MG">Minas Gerais</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="ES">Espírito Santo</option>
                </optgroup>

                <optgroup label="Sul">
                    <option value="PR">Paraná</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="RS">Rio Grande do Sul</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="cursos">Cursos</label>
            <input type="text" name="cursos" id="cursos" list="lista-cursos">
            <datalist id="lista-cursos">
                <option>Administração</option>
                <option>Análise e Desenvolvimento de Sistemas</option>
                <option>Ciência da Computação</option>
                <option>Sistemas de Informação</option>
            </datalist>
        </p>

        <p>
            <label for="msg">Mensagem</label> <br>
            <textarea name="msg" id="msg" cols="30" rows="10" placeholder="Digite sua mensagem aqui..."></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
