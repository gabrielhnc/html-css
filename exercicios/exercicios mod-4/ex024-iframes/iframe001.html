<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de Iframe</title>
    <style>
        iframe {
            width: 500px;
            height: 500px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>

    <!-- TAMANHO PADRAO DO IFRAME: 300x150 -->
     <!-- O ESTILO DE UM IFRAME É DEFINIDO DE FORMA SOBERANA PELO CSS -->
      
    <p>Acessando o site do <iframe src="https://www.cursoemvideo.com/" frameborder="0"><a href="https://www.cursoemvideo.com/" scrolling="no"></a></iframe> para aprender a programar.</p>

    <!-- ALGUNS SITES NAO PERMITEM O USO EM IFRAMES -->

</body>
</html>
