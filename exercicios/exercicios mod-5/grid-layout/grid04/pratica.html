<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Areas</title>

    <style>
        .container {
            display: grid;
            grid-template: repeat(3, 60px) / repeat(7, 1fr);
            grid-auto-flow: row;
            grid-auto-rows: 60px;
            place-items: normal normal;
            place-content: normal normal;
            gap: 10px;
        }

        .header {
            background-color: red;
            grid-row-start: 1;
            grid-row-end: 2;

            grid-column-start: 1;
            grid-column-end: -1;
        }

        .noticia1 {
            background-color: blue;
            grid-row-start: 3;
            grid-row-end: 5;

            grid-column-start: 1;
            grid-column-end: 3;
        }

        .noticia2 {
            background-color: orange;
            grid-row-start: 5;
            grid-row-end: 7;

            grid-column-start: 1;
            grid-column-end: 3;
        }

        .noticia-grande {
            background-color: green;
            grid-row-start: 3;
            grid-row-end: 7;

            grid-column-start: 3;
            grid-column-end: -1;
        }

        .footer {
            background-color: yellow;
            grid-row-start: 8;
            grid-row-end: 10;

            grid-column-start: 1;
            grid-column-end: -1;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="header">HEADER</div>
        <div class="noticia1">NOTICIA 1 PQN</div>
        <div class="noticia2">NOTICIA 2 PQN</div>
        <div class="noticia-grande">NOTICIA GRANDE</div>
        <div class="footer">FOOTER</div>

    </div>
</body>
</html>
