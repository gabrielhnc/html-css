<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROPRIEDADE SHORTHAND</title>
    <style>
        .container {
            display: grid;
            grid-template: repeat(3, 100px) / repeat(4, 1fr);
            grid-auto-flow: row;
            place-items: normal normal;
            place-content: normal normal;
            gap: 5px;
        }

        .caixa1 {
            background-color: red;
            grid-area: 1 / 1 / span 1 / -1;
        }

        .caixa2 {
            background-color: blue;
            grid-area: 2 / 1 / -1 / span 2;
        }

        .caixa3 {
            background-color: green;
            grid-area: 2 / 3 / -1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">CAIXA 1</div>
        <div class="caixa2">CAIXA 2</div>
        <div class="caixa3">CAIXA 3</div>
    </div>
</body>
</html>
