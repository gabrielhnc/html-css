<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 
            FLEX-BASIS -> Controla a "largura dos elementos" dentro do container pai.
            
            Se houver wrap, os elementos diminuem conforme a largura da tela e o tamanho definido no FLEX-BASIS serve como valor base, buscando sempre ter essa largura.

            Com nowrap, os elementos se "comprimem" para que o conteudo interno consiga caber dentro dos elementos, então a largura do FLEX-BASIS, mesmo que definida de forma fixa (diferente de auto), eles receberão dinamicamente uma mudança visual para possibilitar a visualização.
        */

        .container {
            background-color: lightsalmon;
            display: flex;
        }

        .item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">TESTE EADWASDWASDWA</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
    </div>
</body>
</html>
