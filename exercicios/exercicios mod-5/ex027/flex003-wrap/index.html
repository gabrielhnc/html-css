<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            display: flex;
            flex-flow: row wrap;

            /* WRAP:
                nowrap
                wrap
                wrap-reverse
            */

            /* Propriedade de Junção de flex-direction + flex-wrap -> FLEX-FLOW 
            RECOMENDADO UTILIZAR FLEX-FLOW
                
            Exemplo: 
                    flex-flow: row nowrap
                    ordem deve ser a direção e depois o empacotamento (wrap)
            */
    
            background-color: lightsalmon;
        }

        .item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de Bloco: A</div>
        <div class="item">Exemplo de Bloco: B</div>
        <div class="item">Exemplo de Bloco: C</div>
        <div class="item">Exemplo de Bloco: D</div>
        <div class="item">Exemplo de Bloco: E</div>
    </div>
</body>
</html>
