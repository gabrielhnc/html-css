<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 
            ALIGN CONTENT é utilizado quando o container pai possui wrap ativado

            ALIGN CONTENT -> Valor padrão é STRETCH
            Outros possiveis valores:
                flex-start
                flex-end
                space-evenly
                space-between
                space-around
                center
        */

        .container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
            align-content: flex-start;
            height: 400px;
        }

        .item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
