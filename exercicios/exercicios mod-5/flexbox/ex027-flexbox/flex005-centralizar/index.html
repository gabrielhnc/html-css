<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizando com FlexBox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: blue;
        }

        main {
            display: flex;
            flex-flow: row nowrap;  
            justify-content: center;
            align-items: center;

            height: 100vh;
            width: 100vw;

            background-color: aqua;
        }

        section {
            background-color: blue;
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>TELA LOGIN</h1>
        </section>
    </main>
</body>
</html>
