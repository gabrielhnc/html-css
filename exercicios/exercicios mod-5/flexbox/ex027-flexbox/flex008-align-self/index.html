<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 
            ALIGN-SELF -> VALORES POSSIVEIS:
                auto ou inherit (valor herdado do pai)
                flex-start
                flex-end
                center
                stretch

            ALIGN SELF é utilizado especifico para itens.

            Sobrescreve o aligm items definido para o container pai, indicando a posição especifica para o elemento indicado via align-self
        */

        .container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
            height: 400px;
        }

        .item {
            background-color: lightskyblue;
            border: 1px solid black;
            padding: 20px;
        }

        #i1 {
            align-self: center;
        }

        #i2 {
            align-self: flex-end;
        }

        #i3 {
            align-self: flex-end;
        }

        #i4 {
            align-self: stretch;
        }

        #i5 {
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
    </div>
</body>
</html>
