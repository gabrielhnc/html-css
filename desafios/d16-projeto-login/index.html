<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                <!-- IMAGEM INSERIDA VIA CSS -->
            </div>

            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) à tela de Login.</p>

                <form action="login.php" method="POST">
                    <div class="campo-form">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="email" id="email" placeholder="Seu E-mail..." autocomplete="email" required maxlength="30">
                        <label for="email">E-mail</label>
                    </div>

                    <div class="campo-form">
                        <span class="material-symbols-outlined">vpn_key</span>
                        <input type="password" name="senha" id="senha" placeholder="Sua Senha..." autocomplete="current-password" minlength="8" maxlength="20" required>
                        <label for="senha">Senha</label>
                    </div>

                    <input type="submit" value="Entrar">
                    
                    <a href="esqueci.html" class="btn-esquecer">
                        Esqueci a Senha <span class="material-symbols-outlined">mail</span>
                    </a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
